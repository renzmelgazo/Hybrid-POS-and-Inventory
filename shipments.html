                // Store current ship data for use in functions
                window._currentShipData = ship;

                // Update More dropdown based on status
                const moreDropdown = document.getElementById('shipMoreDropdown');
                moreDropdown.innerHTML = `
                    <button class="ship-more-dropdown-item danger" onclick="deleteShipmentFromDetail()">Delete Shipment</button>
                `;

                // Populate Associated Sales Orders tab content
                const soContent = document.getElementById('shipDetailSOContent');
                if (ship.sales_order_id) {
                    try {
                        const soRes = await fetch('/api/sales-orders/' + ship.sales_order_id);
                        if (soRes.ok) {
                            const so = await soRes.json();
                            const soDate = fmtDate(so.created_at || so.date);
                            const soStatus = (so.status || '').toUpperCase();
                            const statusColor = soStatus === 'DELIVERED' ? '#1e8e3e' : soStatus === 'SHIPPED' ? '#1967d2' : '#e37400';
                            const shipmentDate = fmtDate(ship.ship_date);

                            soContent.innerHTML = `
                                <div style="padding:0">
                                    <table style="width:100%;border-collapse:collapse">
                                        <thead>
                                            <tr style="border-bottom:2px solid #4285f4">
                                                <th style="padding:12px 20px;text-align:left;font-size:12px;font-weight:500;color:#888">Date</th>

                                                <th style="padding:12px 20px;text-align:left;font-size:12px;font-weight:500;color:#888">Status</th>

            // ── Header-swap: replaces only the title/search row ──

            const header = document.querySelector('.page-header');
            if (bar && header && header.parentNode && bar.parentNode === header.parentNode) {

        function importShipments() {
            closeShipHeaderKebab();
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.csv';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const text = await file.text();
                const lines = text.split('\n').filter(l => l.trim());
                if (lines.length < 2) { showToast('CSV file is empty or has no data rows.', 'error'); return; }
                const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim().toLowerCase());
                let imported = 0;
                for (let i = 1; i < lines.length; i++) {
                    const cols = lines[i].match(/(".*?"|[^,]+)/g)?.map(c => c.replace(/^"|"$/g, '').trim()) || [];
                    const row = {};
                    headers.forEach((h, idx) => { row[h] = cols[idx] || ''; });
                    try {
                        await fetch('/api/shipments', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                shipment_order_number: row['shipment order#'] || row['shipment_order_number'] || '',
                                carrier: row['carrier'] || '',
                                tracking_number: row['tracking#'] || row['tracking_number'] || '',
                                ship_date: row['ship date'] || row['ship_date'] || (function () { const _d = new Date(); return _d.getFullYear() + '-' + String(_d.getMonth() + 1).padStart(2, '0') + '-' + String(_d.getDate()).padStart(2, '0') })(),
                                shipping_charges: parseFloat(row['shipping charges'] || row['shipping_charges'] || 0),
                                notes: row['notes'] || '',
                                status: row['status'] || 'SHIPPED'
                            })
                        });
                        imported++;
                    } catch (err) { console.error('Error importing row:', err); }
                }
                showToast(`Imported ${imported} shipment(s) successfully.`, 'success');
                loadShipments();
            };
            input.click();
        }

            closeShipHeaderKebab();

            const headers = ['Shipment Order#', 'Customer', 'Sales Order#', 'Package#', 'Carrier', 'Tracking#', 'Status', 'Ship Date', 'Shipping Charges'];
            const rows = allShipments.map(s => [
                s.shipment_order_number || '',
                s.customer_name || '',
                s.sales_order_number || '',
                s.package_number || '',
                s.carrier || '',
                s.tracking_number || '',
                (s.status || '').toUpperCase(),
                fmtDate(s.ship_date),
                parseFloat(s.shipping_charges || 0).toFixed(2)
            ]);
            let csv = headers.join(',') + '\n';
            rows.forEach(r => { csv += r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',') + '\n'; });
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'Shipments.csv';
            a.click();
            showToast('Shipments exported successfully.', 'success');
        }

        async function saveNewShipment() {
            const pkgSelect = document.getElementById('newShipPackage');
            const pkgId = pkgSelect.value;
            if (!pkgId) {
                alert('Please select a Package.');
                return;
            }

            const selectedOpt = pkgSelect.options[pkgSelect.selectedIndex];
            const soId = selectedOpt.getAttribute('data-so-id') || null;
            const shipmentOrderNum = document.getElementById('newShipOrderNum').value;
            const dateStr = document.getElementById('newShipDate').value;
            const carrier = document.getElementById('newShipCarrier').value;
            const trackingNum = document.getElementById('newShipTracking').value;
            const trackingUrl = document.getElementById('newShipTrackingUrl').value;
            const charges = document.getElementById('newShipCharges').value || '0';
            const notes = document.getElementById('newShipNotes').value;
            const alreadyDelivered = document.getElementById('newShipDelivered').checked;

            // Parse date
            let shipDate = new Date();
            if (dateStr) {
                const parts = dateStr.split(' ');
                if (parts.length === 3) {
                    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                    const mIdx = months.indexOf(parts[1]);
                    if (mIdx !== -1) {
                        shipDate = new Date(parseInt(parts[2]), mIdx, parseInt(parts[0]));
                    }
                }
            }

            try {
                const isEditing = !!window._editingShipmentId;
                const url = isEditing ? '/api/shipments/' + window._editingShipmentId : '/api/shipments';
                const method = isEditing ? 'PUT' : 'POST';
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        package_id: parseInt(pkgId),
                        sales_order_id: soId ? parseInt(soId) : null,
                        shipment_order_number: shipmentOrderNum,
                        ship_date: shipDate.getFullYear() + '-' + String(shipDate.getMonth() + 1).padStart(2, '0') + '-' + String(shipDate.getDate()).padStart(2, '0'),
                        carrier: carrier,
                        tracking_number: trackingNum,
                        tracking_url: trackingUrl,
                        shipping_charges: parseFloat(charges) || 0,
                        notes: notes,
                        already_delivered: alreadyDelivered
                    })
                });

                if (res.ok) {
                    closeNewShipmentForm();
                    loadShipments();
                    if (isEditing) viewShipment(window._editingShipmentId);
                    window._editingShipmentId = null;
                } else {
                    const errData = await res.json();
                    alert('Failed to save shipment: ' + (errData.error || 'Unknown error'));
                }
            } catch (err) {
                console.error('Error saving shipment:', err);
                alert('Error saving shipment.');
            }
        }

        // === Edit Shipment ===
        async function editShipmentFromDetail() {
            if (!currentShipDetailId || !window._currentShipData) return;
            const ship = window._currentShipData;

            try {
                // Fetch ALL packages (not just NOT SHIPPED, since this one is already shipped)
                const pkgRes = await fetch('/api/packages');
                const allPkgs = pkgRes.ok ? await pkgRes.json() : [];

                // Fetch customers
                const custRes = await fetch('/api/customers');
                newShipAllCustomers = custRes.ok ? await custRes.json() : [];

                // Populate customer dropdown
                const custSelect = document.getElementById('newShipCustomer');
                custSelect.innerHTML = '<option value="">Select Customer</option>';
                newShipAllCustomers.forEach(c => {
                    custSelect.innerHTML += `<option value="${c.id}" data-name="${c.display_name || c.first_name || ''}">${c.display_name || c.first_name || 'Unknown'}</option>`;
                });

                // Populate package dropdown - include this shipment's package even if already shipped
                const pkgSelect = document.getElementById('newShipPackage');
                pkgSelect.innerHTML = '<option value="">Select Package</option>';
                // Add unshipped packages
                const unshippedPkgs = allPkgs.filter(p => (p.status || '').toUpperCase() === 'NOT SHIPPED');
                // Also include the current shipment's package if not already in list
                const currentPkg = allPkgs.find(p => p.id === ship.package_id);
                const pkgsToShow = [...unshippedPkgs];
                if (currentPkg && !unshippedPkgs.find(p => p.id === currentPkg.id)) {
                    pkgsToShow.unshift(currentPkg);
                }
                newShipAllPackages = pkgsToShow;
                pkgsToShow.forEach(p => {
                    pkgSelect.innerHTML += `<option value="${p.id}" data-number="${p.package_number || ''}" data-customer="${p.customer_name || ''}" data-so-id="${p.sales_order_id || ''}" data-so-num="${p.sales_order_number || ''}">${p.package_number} - ${p.customer_name || ''}</option>`;
                });

                // Carrier suggestions
                const carrierSet = new Set(allShipments.map(s => s.carrier).filter(c => c && c.trim()));
                const datalist = document.getElementById('carrierSuggestions');
                datalist.innerHTML = Array.from(carrierSet).sort().map(c => `<option value="${c}">`).join('');

                // Now set all values
                document.getElementById('newShipOrderNum').value = ship.shipment_order_number || '';

                if (ship.ship_date) {
                    const d = new Date(ship.ship_date);
                    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                    document.getElementById('newShipDate').value = `${String(d.getDate()).padStart(2, '0')} ${months[d.getMonth()]} ${d.getFullYear()}`;
                }

                // Set customer
                if (ship.customer_id) {
                    custSelect.value = String(ship.customer_id);
                } else if (ship.customer_name) {
                    // Find by name
                    for (let i = 0; i < custSelect.options.length; i++) {
                        if (custSelect.options[i].textContent === ship.customer_name) {
                            custSelect.selectedIndex = i;
                            break;
                        }
                    }
                }

                // Set package
                if (ship.package_id) {
                    pkgSelect.value = String(ship.package_id);
                }

                // Set SO number
                document.getElementById('newShipSO').value = ship.sales_order_number || '';

                // Set other fields
                document.getElementById('newShipCarrier').value = ship.carrier || '';
                document.getElementById('newShipTracking').value = ship.tracking_number || '';
                document.getElementById('newShipTrackingUrl').value = ship.tracking_url || '';
                document.getElementById('newShipCharges').value = ship.shipping_charges || '';
                document.getElementById('newShipNotes').value = ship.notes || '';
                document.getElementById('newShipDelivered').checked = ship.already_delivered || false;

                // Fetch and populate package items
                if (ship.package_id) {
                    try {
                        const itemsRes = await fetch('/api/packages/' + ship.package_id);
                        if (itemsRes.ok) {
                            const pkg = await itemsRes.json();
                            newShipSelectedPkgItems = pkg.items || [];
                            const tbody = document.getElementById('newShipItemsBody');
                            tbody.innerHTML = newShipSelectedPkgItems.map((item, idx) => `
                                <tr>
                                    <td>${idx + 1}</td>
                                    <td>${item.item_name || ''}</td>
                                    <td>${parseFloat(item.quantity_to_pack || 0).toFixed(2)}</td>
                                </tr>
                            `).join('');
                        }
                    } catch (e) { /* ignore */ }
                }

                // Set editing state and title
                window._editingShipmentId = currentShipDetailId;
                document.getElementById('newShipFormTitle').innerHTML = '<span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></span> Edit Shipment';
                document.getElementById('newShipOverlay').classList.add('open');

            } catch (err) {
                console.error('Error opening edit shipment form:', err);
                alert('Error opening edit form.');
            }
        }

        // === PDF/Print Dropdown ===
        function toggleShipPdfDropdown(e) {
            e.stopPropagation();
            document.getElementById('shipPdfDropdown').classList.toggle('show');
        }

        document.addEventListener('click', function (e) {
            if (!e.target.closest('.ship-pdf-wrap')) {
                const d = document.getElementById('shipPdfDropdown');
                if (d) d.classList.remove('show');
            }
        });

        function getShipmentPrintHTML() {
            const card = document.querySelector('.ship-doc-card');
            if (!card) return null;
            return `<html><head><title>Shipment</title>
                <style>body{font-family:Inter,sans-serif;padding:20px}.ship-doc-card{max-width:700px;margin:0 auto;border:1px solid #ddd;padding:30px}table{width:100%;border-collapse:collapse}th,td{padding:8px;text-align:left;font-size:12px}.ship-doc-table thead th{background:#1a2840;color:white;padding:10px}.ship-doc-table tbody td{border-bottom:1px solid #eee}.ship-doc-ribbon{display:none}</style>
            </head><body>${card.outerHTML}
</body></html>`;
        }

        function downloadShipmentPdf() {
            document.getElementById('shipPdfDropdown').classList.remove('show');
            const html = getShipmentPrintHTML();
            if (!html) { alert('No shipment document to download.'); return; }
            const w = window.open('', '_blank');
            w.document.write(html);
            w.document.close();
            setTimeout(() => { w.print(); }, 300);
        }

        function printShipmentDetail() {
            document.getElementById('shipPdfDropdown').classList.remove('show');
            const html = getShipmentPrintHTML();
            if (!html) { alert('No shipment document to print.'); return; }
            const w = window.open('', '_blank');
            w.document.write(html);
            w.document.close();
            setTimeout(() => { w.print(); }, 300);
        }

        // === Toggle Delivery Status ===
        async function toggleShipmentDeliveryStatus() {
            if (!currentShipDetailId || !window._currentShipData) return;
            const ship = window._currentShipData;
            const isDelivered = (ship.status || '').toUpperCase() === 'DELIVERED';

            if (isDelivered) {
                if (!confirm('Mark this shipment as undelivered? It will return to Shipped status.')) return;
                try {
                    const res = await fetch('/api/shipments/mark-undelivered/' + ship.package_id, { method: 'PATCH' });
                    if (res.ok) { loadShipments(); viewShipment(currentShipDetailId); }
                    else { alert('Failed to mark as undelivered.'); }
                } catch (err) { console.error(err); alert('Error marking as undelivered.'); }
            } else {
                if (!confirm('Mark this shipment as delivered?')) return;
                try {
                    const res = await fetch('/api/shipments/mark-delivered/' + ship.package_id, { method: 'PATCH' });
                    if (res.ok) { loadShipments(); viewShipment(currentShipDetailId); }
                    else { alert('Failed to mark as delivered.'); }
                } catch (err) { console.error(err); alert('Error marking as delivered.'); }
            }
        }

        // ===== More Dropdown in Shipment Detail =====
        function toggleShipMoreDropdown(e) {
            e.stopPropagation();
            const dropdown = document.getElementById('shipMoreDropdown');
            dropdown.classList.toggle('show');
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', function (e) {
            if (!e.target.closest('.ship-more-dropdown-wrap')) {
                const dropdown = document.getElementById('shipMoreDropdown');
                if (dropdown) dropdown.classList.remove('show');
            }
        });

        async function markShipmentUndelivered() {
            document.getElementById('shipMoreDropdown').classList.remove('show');
            if (!currentShipDetailId) { alert('No shipment selected.'); return; }

            // Get the package_id from the current shipment
            try {
                const res = await fetch('/api/shipments/' + currentShipDetailId);
                if (!res.ok) { alert('Failed to get shipment info.'); return; }
                const ship = await res.json();

                if ((ship.status || '').toUpperCase() !== 'DELIVERED') {
                    alert('This shipment is not delivered yet.');
                    return;
                }

                if (!confirm('Mark this shipment as undelivered? It will return to Shipped status.')) return;

                const patchRes = await fetch('/api/shipments/mark-undelivered/' + ship.package_id, { method: 'PATCH' });
                if (patchRes.ok) {
                    loadShipments();
                    viewShipment(currentShipDetailId);
                } else {
                    alert('Failed to mark as undelivered.');
                }
            } catch (err) {
                console.error('Error marking as undelivered:', err);
                alert('Error marking as undelivered.');
            }
        }

        async function deleteShipmentFromDetail() {
            document.getElementById('shipMoreDropdown').classList.remove('show');
            if (!currentShipDetailId) { alert('No shipment selected.'); return; }

            if (!confirm('Are you sure you want to delete this shipment? The package will return to Not Shipped.')) return;

            try {
                const res = await fetch('/api/shipments/' + currentShipDetailId, { method: 'DELETE' });
                if (res.ok) {
                    closeShipmentDetail();
                    loadShipments();
                } else {
                    alert('Failed to delete shipment.');
                }
            } catch (err) {
                console.error('Error deleting shipment:', err);
                alert('Error deleting shipment.');
            }
        }
    </script>
    <!-- Kebab More Dropdown -->
    <div class="ship-more-dropdown" id="shipMoreDrop">
        <button class="ship-more-item sort-by-item" onmouseenter="showSortSub()" onmouseleave="hideSortSub()">
            <span class="ship-more-icon">⇅</span> Sort by <span class="ship-more-arrow">›</span>
        </button>
        <button class="ship-more-item" onclick="importShipments()">
            <span class="ship-more-icon">⬇</span> Import
        </button>
        <button class="ship-more-item" onclick="exportShipments()">
            <span class="ship-more-icon">⬆</span> Export
        </button>
        <button class="ship-more-item" onclick="refreshShipments()">
            <span class="ship-more-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></span> Refresh List
        </button>
    </div>

    <!-- Sort Submenu -->
    <div class="ship-sort-submenu" id="shipSortSub" onmouseenter="keepSortSub()" onmouseleave="hideSortSub()">
        <button onclick="sortShipBy('ship_date')" class="active">Date</button>
        <button onclick="sortShipBy('shipment_order_number')">Shipment Order#</button>
        <button onclick="sortShipBy('customer_name')">Customer Name</button>
        <button onclick="sortShipBy('sales_order_number')">Sales Order#</button>
        <button onclick="sortShipBy('carrier')">Carrier</button>
        <button onclick="sortShipBy('status')">Status</button>
        <button onclick="sortShipBy('shipping_charges')">Shipping Rate</button>
    </div>

    <script src="/js/sticky-headers.js"></script>
</body>

</html>
