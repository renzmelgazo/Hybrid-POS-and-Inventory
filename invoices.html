        function sortInvoicesBy(field) {
            var labels = { created_at: 'Created Time', updated_at: 'Last Modified Time', invoice_date: 'Date', invoice_number: 'Invoice#', order_number: 'Order Number', customer_name: 'Customer Name', due_date: 'Due Date', total: 'Amount', balance_due: 'Balance Due' };
            // Toggle direction if same field clicked again
            if (currentSortField === field) {
                currentSortDir = currentSortDir === 'asc' ? 'desc' : 'asc';
            } else {
                currentSortField = field;
                // Default direction: dates/numbers = desc (newest/highest first), strings = asc (A-Z)
                if (field === 'total' || field === 'balance_due' || field.includes('date') || field.includes('created') || field.includes('updated')) {
                    currentSortDir = 'desc';
                } else {
                    currentSortDir = 'asc';
                }
            }
            var dir = currentSortDir;
            allInvoices.sort(function (a, b) {
                var va = a[field], vb = b[field];
                var result = 0;
                if (field.includes('date') || field.includes('created') || field.includes('updated')) {
                    va = va ? new Date(va).getTime() : 0;
                    vb = vb ? new Date(vb).getTime() : 0;
                    result = va - vb;
                } else if (field === 'total' || field === 'balance_due') {
                    result = (parseFloat(va) || 0) - (parseFloat(vb) || 0);
                } else {
                    va = (va || '').toString().toLowerCase();
                    vb = (vb || '').toString().toLowerCase();
                    result = va.localeCompare(vb);
                }
                return dir === 'asc' ? result : -result;
            });
            renderFilteredInvoices();
            // Close menus
            var mm = document.getElementById('invMoreMenu');
            if (mm) mm.style.display = 'none';
            var ss = document.getElementById('invSortSub');
            if (ss) ss.style.display = 'none';
            // Also re-render left panel list if in detail view
            var detailView = document.getElementById('detailView');
            if (detailView && detailView.classList.contains('active')) {
                var list = document.getElementById('invLeftList');
                if (list) {
                    list.innerHTML = allInvoices.map(function (inv) {
                        var smart = getSmartStatus(inv);
                        return '<div class="inv-left-item ' + (inv.id === selectedInvoiceId ? 'active' : '') + '" data-id="' + inv.id + '" onclick="selectInvoice(' + inv.id + ')">' +
                            '<div class="inv-left-item-top">' +
                            '<span class="inv-left-item-name">' + (inv.customer_name || 'No Customer') + '</span>' +
                            '<span class="inv-left-item-amount">' + formatCurrency(inv.total) + '</span>' +
                            '</div>' +
                            '<div class="inv-left-item-bottom">' +
                            '<span>' + inv.invoice_number + '</span>' +
                            '<span>·</span>' +
                            '<span>' + formatDate(inv.invoice_date) + '</span>' +
                            '</div>' +
                            '<div class="inv-left-item-status" style="font-size:11px;"><span class="' + smart.cls + '">' + smart.label + '</span></div>' +
                            '</div>';
                    }).join('');
                }
            }
            // Build toast message with contextual direction label
            var dirLabel = '';
            if (field === 'total' || field === 'balance_due') {
                dirLabel = dir === 'desc' ? 'Highest → Lowest' : 'Lowest → Highest';
            } else if (field.includes('date') || field.includes('created') || field.includes('updated')) {
                dirLabel = dir === 'desc' ? 'Newest → Oldest' : 'Oldest → Newest';
            } else if (field === 'invoice_number' || field === 'order_number') {
                dirLabel = dir === 'asc' ? 'Ascending' : 'Descending';
            } else {
                dirLabel = dir === 'asc' ? 'A → Z' : 'Z → A';
            }
            showToast((labels[field] || field) + ': ' + dirLabel, 'info');
        }

        function exportInvoicesCSV() {
            var mm = document.getElementById('invMoreMenu');
            if (mm) mm.style.display = 'none';
            var headers = ['Invoice#', 'Date', 'Order Number', 'Customer Name', 'Status', 'Due Date', 'Amount', 'Balance Due'];
            var rows = [headers.join(',')];
            var data = allInvoices;
            if (currentInvFilter !== 'all') {
                data = data.filter(function (inv) {
                    var s = getSmartStatus(inv);
                    return s.category === currentInvFilter || (currentInvFilter === 'void' && (inv.status || '').toUpperCase() === 'VOID');
                });
            }
            data.forEach(function (inv) {
                var s = getSmartStatus(inv);
                rows.push([
                    '"' + (inv.invoice_number || '') + '"',
                    '"' + formatDate(inv.invoice_date) + '"',
                    '"' + (inv.order_number || '') + '"',
                    '"' + (inv.customer_name || '') + '"',
                    '"' + s.label + '"',
                    '"' + formatDate(inv.due_date) + '"',
                    (parseFloat(inv.total) || 0).toFixed(2),
                    (parseFloat(inv.balance_due) || 0).toFixed(2)
                ].join(','));
            });
            var csv = rows.join('\n');
            var blob = new Blob([csv], { type: 'text/csv' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'invoices_export_' + new Date().toISOString().slice(0, 10) + '.csv';
            a.click();
            showToast('Exported ' + data.length + ' invoices as CSV', 'success');
        }

        async function importInvoicesCSV(input) {
            if (!input.files || !input.files[0]) return;
            var file = input.files[0];
            var reader = new FileReader();
            reader.onload = async function (e) {
                try {
                    var lines = e.target.result.split('\n').filter(function (l) { return l.trim(); });
                    if (lines.length < 2) { showToast('CSV file is empty or has no data rows', 'info'); return; }
                    var headers = lines[0].split(',').map(function (h) { return h.replace(/"/g, '').trim().toLowerCase(); });
                    var count = 0;
                    for (var i = 1; i < lines.length; i++) {
                        var vals = lines[i].match(/("[^"]*"|[^,]+)/g) || [];
                        vals = vals.map(function (v) { return v.replace(/^"|"$/g, '').trim(); });
                        var obj = {};
                        headers.forEach(function (h, idx) { obj[h] = vals[idx] || ''; });
                        try {
                            var res = await fetch('/api/invoices', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    invoice_number: obj['invoice#'] || obj['invoice_number'] || '',
                                    customer_name: obj['customer name'] || obj['customer_name'] || '',
                                    invoice_date: obj['date'] || obj['invoice_date'] || new Date().toISOString().slice(0, 10),
                                    due_date: obj['due date'] || obj['due_date'] || '',
                                    order_number: obj['order number'] || obj['order_number'] || '',
                                    total: parseFloat(obj['amount'] || obj['total'] || 0),
                                    status: 'DRAFT'
                                })
                            });
                            if (res.ok) count++;
                        } catch (err) { console.error('Row import error:', err); }
                    }
                    await loadInvoices();
                    showToast('Imported ' + count + ' invoices from CSV', 'success');
                } catch (err) {
                    showToast('Failed to import CSV: ' + err.message, 'info');
                }
            };
            reader.readAsText(file);
            input.value = '';
        }

            // Filter only DRAFT invoices
            const draftIds = ids.filter(id => {
                const inv = allInvoices.find(i => i.id === id);
                return inv && (inv.status || '').toUpperCase() === 'DRAFT';
            });

            if (draftIds.length === 0) {
                showToast('No DRAFT invoices selected. Only DRAFT invoices can be marked as Issued.', 'info');
                return;
            }

            if (!confirm('Mark ' + draftIds.length + ' selected invoice' + (draftIds.length !== 1 ? 's' : '') + ' as Issued?')) return;

            let successCount = 0;
            for (const id of draftIds) {
                try {
                    const res = await fetch('/api/invoices/' + id + '/status', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ status: 'ISSUED' })
                    });
                    if (res.ok) successCount++;
                } catch (e) { console.error(e); }
            }

            const skipped = ids.length - draftIds.length;
            let msg = successCount + ' invoice' + (successCount !== 1 ? 's' : '') + ' marked as Issued.';
            if (skipped > 0) msg += ' ' + skipped + ' non-DRAFT invoice' + (skipped !== 1 ? 's' : '') + ' skipped.';
            showToast(msg, 'success');
            clearInvBulkSelection();
            localStorage.setItem('invoice_refresh_needed', 'true');
            loadInvoices();
        }

        async function bulkVoidInvoices() {
            document.getElementById('invBulkMoreMenu').classList.remove('show');
            const ids = getSelectedInvoiceIds();
            if (ids.length === 0) return;

            // Filter: allow Issued/Due/Overdue, NOT PAID, NOT DRAFT, NOT VOID
            const eligibleIds = ids.filter(id => {
                const inv = allInvoices.find(i => i.id === id);
                if (!inv) return false;
                const smart = getSmartStatus(inv);
                const status = (inv.status || '').toUpperCase();
                // Don't void PAID, DRAFT, or already VOID invoices
                if (smart.category === 'paid' || status === 'DRAFT' || status === 'VOID') return false;
                return true;
            });

            if (eligibleIds.length === 0) {
                showToast('No eligible invoices to void. PAID, DRAFT, and already VOID invoices cannot be voided.', 'info');
                return;
            }

            const paidSkipped = ids.length - eligibleIds.length;
            if (!confirm('Are you sure you want to VOID ' + eligibleIds.length + ' selected invoice' + (eligibleIds.length !== 1 ? 's' : '') + '? This cannot be undone.')) return;

            let successCount = 0;
            for (const id of eligibleIds) {
                try {
                    const res = await fetch('/api/invoices/' + id + '/status', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ status: 'VOID' })
                    });
                    if (res.ok) successCount++;
                } catch (e) { console.error(e); }
            }

            let msg = successCount + ' invoice' + (successCount !== 1 ? 's' : '') + ' voided.';
            if (paidSkipped > 0) msg += ' ' + paidSkipped + ' invoice' + (paidSkipped !== 1 ? 's' : '') + ' skipped (PAID/DRAFT/VOID).';
            showToast(msg, 'success');
            clearInvBulkSelection();
            localStorage.setItem('invoice_refresh_needed', 'true');
            loadInvoices();
        }

        async function bulkDeleteInvoices() {
            document.getElementById('invBulkMoreMenu').classList.remove('show');
            const ids = getSelectedInvoiceIds();
            if (ids.length === 0) return;

            // Filter: only DRAFT or VOID can be deleted
            const eligibleIds = ids.filter(id => {
                const inv = allInvoices.find(i => i.id === id);
                if (!inv) return false;
                const status = (inv.status || '').toUpperCase();
                return status === 'DRAFT' || status === 'VOID';
            });

            if (eligibleIds.length === 0) {
                showToast('No eligible invoices to delete. Only DRAFT and VOID invoices can be deleted.', 'info');
                return;
            }

            if (!confirm('Permanently DELETE ' + eligibleIds.length + ' selected invoice' + (eligibleIds.length !== 1 ? 's' : '') + '?')) return;

            let successCount = 0;
            for (const id of eligibleIds) {
                try {
                    const res = await fetch('/api/invoices/' + id, { method: 'DELETE' });
                    if (res.ok) successCount++;
                } catch (e) { console.error(e); }
            }

            const skipped = ids.length - eligibleIds.length;
            let msg = successCount + ' invoice' + (successCount !== 1 ? 's' : '') + ' deleted.';
            if (skipped > 0) msg += ' ' + skipped + ' invoice' + (skipped !== 1 ? 's' : '') + ' skipped (only DRAFT/VOID can be deleted).';
            showToast(msg, 'success');
            clearInvBulkSelection();
            localStorage.setItem('invoice_refresh_needed', 'true');
            loadInvoices();
        }

        // ===== DOWNLOAD INVOICE AS PDF (html2pdf.js) =====
        async function downloadInvoicePdf() {
            var dd = document.getElementById('invPdfDropdown');
            if (dd) dd.style.display = 'none';
            if (!selectedInvoiceId) return;

            // Load html2pdf.js if needed
            if (!window.html2pdf) {
                const s = document.createElement('script');
                s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
                document.head.appendChild(s);
                await new Promise(resolve => { s.onload = resolve; });
            }

            try {
                const res = await fetch('/api/invoices/' + selectedInvoiceId);
                if (!res.ok) return;
                const inv = await res.json();
                const html = generateInvoiceDocHTML(inv);
                const tmp = document.createElement('div');
                tmp.innerHTML = html;
                document.body.appendChild(tmp);
                try {
                    await html2pdf().set({
                        margin: [10, 10, 10, 10],
                        filename: (inv.invoice_number || 'Invoice') + '.pdf',
                        image: { type: 'jpeg', quality: 0.98 },
                        html2canvas: { scale: 2 },
                        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                    }).from(tmp.firstElementChild).save();
                } finally { document.body.removeChild(tmp); }
            } catch (e) { console.error(e); }
        }

            if (mm) mm.style.display = 'none';
            var bm = document.getElementById('invBulkMoreMenu');
            if (bm) bm.classList.remove('show');
            var pd = document.getElementById('invPdfDropdown');
            if (pd) pd.style.display = 'none';
        });

        loadInvoices().then(() => {
            // Auto-open invoice detail from URL params (e.g. from Save and Print)
            const urlParams = new URLSearchParams(window.location.search);
            const invoiceId = urlParams.get('invoiceId');
            if (invoiceId) {
                const id = parseInt(invoiceId);
                if (id && allInvoices.find(inv => inv.id === id)) {
                    openInvoiceDetail(id);
                    // Auto-trigger print if requested
                    if (urlParams.get('print') === 'true') {
                        setTimeout(() => window.print(), 800);
                    }
                }
            }
        });
    </script>
    <script src="/js/sticky-headers.js"></script>
</body>

</html>
