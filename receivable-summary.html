<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receivable Summary - Reports</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/sticky-headers.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="/css/report-export.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Source+Sans+Pro:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', 'Source Sans Pro', Helvetica, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f5f6fa;
            font-size: 13px;
        }

        .main-layout {
            display: flex;
            min-height: 100vh;
        }

        .content {
            flex: 1;
            margin-left: 260px;
            padding: 0;
            background: #fff;
        }

        /* ===== TOP HEADER BAR ===== */
        .report-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            min-height: 44px;
        }

        .report-top-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hamburger-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #555;
            padding: 4px 8px;
        }

        .breadcrumb-area {
            display: flex;
            flex-direction: column;
        }

        .breadcrumb-category {
            font-size: 11px;
            color: #999;
        }

        .breadcrumb-title {
            font-size: 15px;
            font-weight: 600;
            color: #222;
        }

        .breadcrumb-date {
            font-size: 11px;
            color: #999;
            font-weight: 400;
            margin-left: 6px;
        }

        .top-bar-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .top-bar-actions button {
            background: none;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 14px;
            color: #555;
        }

        .top-bar-actions button:hover {
            background: #f5f5f5;
        }

        .btn-export {
            font-size: 12px !important;
            font-weight: 500;
        }

        .btn-close-report {
            color: #e53935 !important;
            font-weight: bold;
        }

        /* ===== FILTER BAR ===== */
        .filter-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            background: #f9fafb;
            border-bottom: 1px solid #e8e8e8;
        }

        .filter-label {
            font-size: 12px;
            font-weight: 600;
            color: #555;
        }

        .filter-dropdown {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 12px;
            color: #333;
        }

        .filter-dropdown select {
            border: none;
            outline: none;
            font-size: 12px;
            color: #2563eb;
            font-weight: 500;
            cursor: pointer;
            background: transparent;
        }

        .btn-run-report {
            background: #e53935;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 7px 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-left: 8px;
        }

        .btn-run-report:hover {
            background: #c62828;
        }

        /* ===== REPORT BODY ===== */
        .report-body {
            padding: 30px 20px 60px;
            overflow-x: auto;
        }

        .report-header-section {
            text-align: center;
            margin-bottom: 24px;
        }

        .company-name {
            font-size: 13px;
            color: #888;
            margin-bottom: 4px;
        }

        .report-main-title {
            font-size: 17px;
            font-weight: 700;
            color: #222;
        }

        .report-date-range {
            font-size: 12px;
            color: #888;
            margin-top: 2px;
        }

        .date-highlight {
            color: #2563eb;
            font-weight: 500;
        }

        /* ===== REPORT TABLE ===== */
        .report-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 1200px;
        }

        .report-table thead th {
            text-align: left;
            font-size: 10px;
            font-weight: 700;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            padding: 10px 10px;
            border-bottom: 2px solid #ddd;
            background: #fafafa;
            white-space: nowrap;
        }

        .report-table tbody td {
            padding: 10px 10px;
            border-bottom: 1px solid #f0f0f0;
            color: #333;
            white-space: nowrap;
        }

        .report-table tfoot td {
            padding: 10px 10px;
            font-weight: 700;
            border-top: 2px solid #ddd;
            background: #fafafa;
            color: #222;
        }

        .report-table tbody tr:hover {
            background: #f8f9ff;
        }

        .align-right {
            text-align: right !important;
        }

        .align-center {
            text-align: center !important;
        }

        .customer-link {
            color: #2563eb;
            cursor: pointer;
            font-weight: 500;
        }

        .customer-link:hover {
            text-decoration: underline;
        }

        .transaction-link {
            color: #d84315;
            cursor: pointer;
            font-weight: 500;
        }

        .transaction-link:hover {
            text-decoration: underline;
        }

        .amount-positive {
            color: #333;
        }

        .amount-negative {
            color: #d84315;
        }

        /* Status badges */
        .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .status-paid {
            background: #d1fae5;
            color: #059669;
        }

        .status-sent {
            background: #dbeafe;
            color: #2563eb;
        }

        .status-overdue {
            background: #fee2e2;
            color: #dc2626;
        }

        .status-draft {
            background: #f3f4f6;
            color: #6b7280;
        }

        .status-closed {
            background: #d1fae5;
            color: #059669;
        }

        .status-open {
            background: #fef3c7;
            color: #d97706;
        }

        .status-partially-paid {
            background: #fef3c7;
            color: #d97706;
        }

        .status-void {
            background: #f3f4f6;
            color: #9ca3af;
        }

        .type-invoice {
            color: #2563eb;
            font-weight: 500;
        }

        .type-credit-note {
            color: #7c3aed;
            font-weight: 500;
        }

        .total-count-section {
            padding: 16px 10px;
            font-size: 13px;
            color: #555;
            border-top: 1px solid #eee;
        }

        .total-count-section strong {
            color: #222;
        }
    </style>
</head>

<body>
    <div id="sidebarContainer"></div>

    <div class="main-layout">
        <div class="content" id="content">

            <!-- TOP HEADER BAR -->
            <div class="report-top-bar">
                <div class="report-top-left">
                    <button class="hamburger-btn" onclick="window.location.href='/reports.html'">☰</button>
                    <div class="breadcrumb-area">
                        <span class="breadcrumb-category">Receivables</span>
                        <span class="breadcrumb-title">
                            Receivable Summary
                            <span class="breadcrumb-date" id="breadcrumbDate">•</span>
                        </span>
                    </div>
                </div>
                <div class="top-bar-actions">
                    <button title="Schedule"><span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span></button>
                    <button title="Refresh" onclick="runReport()"><span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></span></button>
                    <button title="Share"><span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg></span></button>
                    <button class="btn-export" title="Export">Export ▾</button>
                    <button title="Print" onclick="window.print()"><span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg></span></button>
                    <button class="btn-close-report" title="Close"
                        onclick="window.location.href='/reports.html'">✕</button>
                </div>
            </div>

            <!-- FILTER BAR -->
            <div class="filter-bar">
                <span class="filter-label"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg> Filters :</span>

                <div class="filter-dropdown">
                    <span>Date Range :</span>
                    <select id="dateRangeSelect" onchange="handleFilterChange()" title="Date Range">
                        <option value="this-month" selected>This Month</option>
                        <option value="last-month">Last Month</option>
                        <option value="this-quarter">This Quarter</option>
                        <option value="this-year">This Year</option>
                        <option value="all">All Time</option>
                    </select>
                </div>

                <button class="btn-run-report" onclick="runReport()">Run Report</button>
            </div>

            <!-- REPORT BODY -->
            <div class="report-body">
                <div class="report-header-section">
                    <div class="report-main-title">Receivable Summary</div>
                    <div class="report-date-range" id="reportDateRange">
                        From <span class="date-highlight" id="fromDateDisplay">-</span>
                        To <span class="date-highlight" id="toDateDisplay">-</span>
                    </div>
                </div>

                <table class="report-table">
                    <thead>
                        <tr>
                            <th>CUSTOMER NAME</th>
                            <th>DATE ↓</th>
                            <th>TRANSACTION#</th>
                            <th>REFERENCE#</th>
                            <th>STATUS</th>
                            <th>TRANSACTION TYPE</th>
                            <th class="align-right">TOTAL (BCY)</th>
                            <th class="align-right">TOTAL (FCY)</th>
                            <th class="align-right">BALANCE (BCY)</th>
                            <th class="align-right">BALANCE (FCY)</th>
                        </tr>
                    </thead>
                    <tbody id="reportTableBody">
                        <tr>
                            <td colspan="10" class="align-center">Loading...</td>
                        </tr>
                    </tbody>
                    <tfoot id="reportTableFoot" style="display:none;">
                        <tr>
                            <td><strong>Total</strong></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td class="align-right" id="totTotalBcy"></td>
                            <td class="align-right" id="totTotalFcy"></td>
                            <td class="align-right" id="totBalanceBcy"></td>
                            <td class="align-right" id="totBalanceFcy"></td>
                        </tr>
                    </tfoot>
                </table>

                <div class="total-count-section" id="totalCountSection" style="display:none;">
                    <strong>Total Count:</strong> <span id="totalCount">0</span>
                </div>
            </div>

        </div>
    </div>

    <script src="/js/layout.js"></script>
    <script src="/js/report-export.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            runReport();
        });

        function getDateRange() {
            const sel = document.getElementById('dateRangeSelect').value;
            const now = new Date();
            let from, to;

            switch (sel) {
                case 'this-month':
                    from = new Date(now.getFullYear(), now.getMonth(), 1);
                    to = new Date(now.getFullYear(), now.getMonth() + 1, 0);
                    break;
                case 'last-month':
                    from = new Date(now.getFullYear(), now.getMonth() - 1, 1);
                    to = new Date(now.getFullYear(), now.getMonth(), 0);
                    break;
                case 'this-quarter': {
                    const q = Math.floor(now.getMonth() / 3);
                    from = new Date(now.getFullYear(), q * 3, 1);
                    to = new Date(now.getFullYear(), q * 3 + 3, 0);
                    break;
                }
                case 'this-year':
                    from = new Date(now.getFullYear(), 0, 1);
                    to = new Date(now.getFullYear(), 11, 31);
                    break;
                case 'all':
                    return { from: null, to: null };
            }

            return {
                from: from.toISOString().split('T')[0],
                to: to.toISOString().split('T')[0]
            };
        }

        function fmtDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        function fmtPHP(val) {
            const num = parseFloat(val) || 0;
            const prefix = num < 0 ? 'PHP-' : 'PHP';
            return prefix + Math.abs(num).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function amountClass(val) {
            const num = parseFloat(val) || 0;
            return num < 0 ? 'amount-negative' : 'amount-positive';
        }

        function getStatusBadge(status) {
            if (!status) return '<span class="status-badge status-draft">Draft</span>';
            const s = status.toUpperCase();
            if (s === 'PAID') return '<span class="status-badge status-paid">Paid</span>';
            if (s === 'SENT') return '<span class="status-badge status-sent">Sent</span>';
            if (s === 'OVERDUE') return '<span class="status-badge status-overdue">Overdue</span>';
            if (s === 'CLOSED') return '<span class="status-badge status-closed">Closed</span>';
            if (s === 'OPEN') return '<span class="status-badge status-open">Open</span>';
            if (s === 'PARTIALLY PAID' || s === 'PARTIALLY_PAID') return '<span class="status-badge status-partially-paid">Partially Paid</span>';
            if (s === 'DRAFT') return '<span class="status-badge status-draft">Draft</span>';
            if (s === 'VOID' || s === 'CANCELLED') return '<span class="status-badge status-void">Void</span>';
            return '<span class="status-badge status-sent">' + status.charAt(0).toUpperCase() + status.slice(1).toLowerCase() + '</span>';
        }

        function getTypeLabel(type) {
            if (type === 'Credit Note') return '<span class="type-credit-note">Credit Note</span>';
            return '<span class="type-invoice">Invoice</span>';
        }

        function handleFilterChange() {
            runReport();
        }

        async function runReport() {
            const tbody = document.getElementById('reportTableBody');
            const tfoot = document.getElementById('reportTableFoot');
            const countSection = document.getElementById('totalCountSection');
            tbody.innerHTML = '<tr><td colspan="10" class="align-center">Loading...</td></tr>';
            tfoot.style.display = 'none';
            countSection.style.display = 'none';

            const { from, to } = getDateRange();

            // Update header dates
            if (from && to) {
                document.getElementById('fromDateDisplay').textContent = fmtDate(from);
                document.getElementById('toDateDisplay').textContent = fmtDate(to);
                document.getElementById('breadcrumbDate').textContent = `• From ${fmtDate(from)} To ${fmtDate(to)}`;
            } else {
                document.getElementById('fromDateDisplay').textContent = 'All Time';
                document.getElementById('toDateDisplay').textContent = '';
                document.getElementById('breadcrumbDate').textContent = '• All Time';
            }

            try {
                let url = '/api/invoices/reports/receivable-summary?';
                const qp = [];
                if (from && to) {
                    qp.push(`from=${from}&to=${to}`);
                }
                url += qp.join('&');

                const res = await fetch(url);
                if (!res.ok) throw new Error('API error');
                const data = await res.json();

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="10" class="align-center">No receivable data found for this period.</td></tr>';
                    return;
                }

                let totTotalBcy = 0;
                let totTotalFcy = 0;
                let totBalanceBcy = 0;
                let totBalanceFcy = 0;

                tbody.innerHTML = data.map(row => {
                    const bcyTotal = parseFloat(row.bcy_total) || 0;
                    const fcyTotal = parseFloat(row.fcy_total) || 0;
                    const bcyBalance = parseFloat(row.bcy_balance) || 0;
                    const fcyBalance = parseFloat(row.fcy_balance) || 0;
                    totTotalBcy += bcyTotal;
                    totTotalFcy += fcyTotal;
                    totBalanceBcy += bcyBalance;
                    totBalanceFcy += fcyBalance;

                    return `
                        <tr>
                            <td class="customer-link">${row.customer_name || ''}</td>
                            <td>${fmtDate(row.transaction_date)}</td>
                            <td class="transaction-link">${row.transaction_number || ''}</td>
                            <td>${row.reference_number || ''}</td>
                            <td>${getStatusBadge(row.status)}</td>
                            <td>${getTypeLabel(row.transaction_type)}</td>
                            <td class="align-right ${amountClass(bcyTotal)}">${fmtPHP(bcyTotal)}</td>
                            <td class="align-right ${amountClass(fcyTotal)}">${fmtPHP(fcyTotal)}</td>
                            <td class="align-right ${amountClass(bcyBalance)}">${fmtPHP(bcyBalance)}</td>
                            <td class="align-right ${amountClass(fcyBalance)}">${fmtPHP(fcyBalance)}</td>
                        </tr>
                    `;
                }).join('');

                document.getElementById('totTotalBcy').innerHTML = `<span class="${amountClass(totTotalBcy)}">${fmtPHP(totTotalBcy)}</span>`;
                document.getElementById('totTotalFcy').innerHTML = `<span class="${amountClass(totTotalFcy)}">${fmtPHP(totTotalFcy)}</span>`;
                document.getElementById('totBalanceBcy').innerHTML = `<span class="${amountClass(totBalanceBcy)}">${fmtPHP(totBalanceBcy)}</span>`;
                document.getElementById('totBalanceFcy').innerHTML = `<span class="${amountClass(totBalanceFcy)}">${fmtPHP(totBalanceFcy)}</span>`;
                tfoot.style.display = '';

                document.getElementById('totalCount').textContent = data.length;
                countSection.style.display = '';

            } catch (e) {
                console.error('Error:', e);
                tbody.innerHTML = '<tr><td colspan="10" class="align-center">Error loading report data.</td></tr>';
            }
        }
    </script>
    <script src="/js/sticky-headers.js"></script>
</body>

</html>
