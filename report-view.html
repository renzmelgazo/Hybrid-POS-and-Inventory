    // ─── Dynamic Extra Filters ───
    function renderExtraFilters(filters) {
      if (_extraFiltersRendered) return; // only build DOM once
      const container = document.getElementById('extraFiltersContainer');
      container.innerHTML = '';

      filters.forEach(f => {
        const wrapper = document.createElement('div');
        wrapper.className = 'filter-dropdown-wrapper';

        const label = document.createElement('span');
        label.className = 'filter-dropdown-label';
        label.textContent = f.label + (f.label.endsWith(':') ? '' : ' :');

        if (f.type === 'text') {
          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'filter-dropdown-select';
          input.style.width = '200px';
          input.id = 'filter_' + f.key;
          input.dataset.filterKey = f.key;
          if (f.placeholder) input.placeholder = f.placeholder;
          
          input.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const rows = document.querySelectorAll('#reportTable tbody tr');
            rows.forEach(row => {
              const text = row.textContent.toLowerCase();
              row.style.display = text.includes(term) ? '' : 'none';
            });
          });

          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') runReport();
          });
          wrapper.appendChild(label);
          wrapper.appendChild(input);
        } else {
          const select = document.createElement('select');
          select.className = 'filter-dropdown-select';
          select.id = 'filter_' + f.key;
          select.dataset.filterKey = f.key;

          if (f.options) {
            f.options.forEach(opt => {
              const optEl = document.createElement('option');
              optEl.value = opt;
              optEl.textContent = opt;
              select.appendChild(optEl);
            });
          }

          select.addEventListener('change', () => runReport());
          wrapper.appendChild(label);
          wrapper.appendChild(select);
        }

        container.appendChild(wrapper);
      });

      _extraFiltersRendered = true;
    }

    // ─── Helpers ───
    function formatDate(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      const day = d.getDate().toString().padStart(2, '0');
      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const month = monthNames[d.getMonth()];
      const year = d.getFullYear();
      return `${month} ${day}, ${year}`;
    }

    function formatNumber(val) {
      const n = Number(val);
      if (isNaN(n)) return val;
      if (Number.isInteger(n) && Math.abs(n) < 1000) return String(n);
      return n.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ─── Export Functions ───
    function toggleExport() {
      const dd = document.getElementById('exportDropdown');
      dd.classList.toggle('show');
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.export-wrapper')) {
        document.getElementById('exportDropdown').classList.remove('show');
      }
    });

    function exportCSV() {
      if (!currentData.rows || !currentData.rows.length) return;
      const cols = currentData.columns;
      const keys = Object.keys(currentData.rows[0]);
      let csv = cols.join(',') + '\n';
      currentData.rows.forEach(row => {
        csv += keys.map(k => `"${String(row[k] ?? '').replace(/"/g, '""')}"`).join(',') + '\n';
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${currentData.title || 'report'}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      document.getElementById('exportDropdown').classList.remove('show');
    }

    function exportPDF() {
      if (!currentData.rows || !currentData.rows.length) return;
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'landscape' });
      doc.setFontSize(16);
      doc.text(currentData.title || 'Report', 14, 20);
      doc.setFontSize(10);
      doc.text(document.getElementById('reportDateRange').textContent, 14, 28);

      const keys = Object.keys(currentData.rows[0]);
      const body = currentData.rows.map(r => keys.map(k => String(r[k] ?? '-')));

      doc.autoTable({
        head: [currentData.columns],
        body,
        startY: 34,
        styles: { fontSize: 8 },
        headStyles: { fillColor: [139, 26, 26] }
      });
      doc.save(`${currentData.title || 'report'}.pdf`);
      document.getElementById('exportDropdown').classList.remove('show');
    }

    function printReport() {
      window.print();
      document.getElementById('exportDropdown').classList.remove('show');
    }

    // ─── FIFO Lot Consumption Drawer ───
    async function openFifoLotDrawer(lotId) {
      if (!lotId) return;
      // Remove existing drawer if any
      let overlay = document.getElementById('fifoDrawerOverlay');
      let drawer = document.getElementById('fifoDrawer');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'fifoDrawerOverlay';
        overlay.className = 'fifo-drawer-overlay';
        overlay.onclick = closeFifoDrawer;
        document.body.appendChild(overlay);
      }
      if (!drawer) {
        drawer = document.createElement('div');
        drawer.id = 'fifoDrawer';
        drawer.className = 'fifo-drawer';
        document.body.appendChild(drawer);
      }

      // Show loading state
      drawer.innerHTML = `
        <div class="fifo-drawer-header">
          <h3>Lot Consumption History</h3>
          <p class="subtitle">Loading...</p>
          <button class="fifo-drawer-close" onclick="closeFifoDrawer()">&times;</button>
        </div>
        <div class="fifo-drawer-body" style="display:flex;align-items:center;justify-content:center;">
          <div style="text-align:center;color:#a0aec0;">Loading consumption data...</div>
        </div>`;

      // Open drawer
      requestAnimationFrame(() => {
        overlay.classList.add('open');
        drawer.classList.add('open');
      });

      try {
        const resp = await fetch(`/api/reports/fifo-lot-consumption/${lotId}`);
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'Failed to load lot data');

        const lot = data.lot;
        const fmtP = (v) => '₱' + parseFloat(v).toLocaleString('en-PH', {minimumFractionDigits:2, maximumFractionDigits:2});

        let consumptionHtml = '';
        if (data.consumption.length === 0) {
          consumptionHtml = `
            <div class="no-consumption">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <p style="font-size:14px;font-weight:600;margin:0 0 4px;">No Consumption Records</p>
              <p style="font-size:12px;margin:0;">This lot has not been consumed by any sales transactions yet.</p>
            </div>`;
        } else {
          consumptionHtml = `
            <table>
              <thead><tr>
                <th>Reference</th>
                <th style="text-align:right;">Qty Consumed</th>
                <th style="text-align:right;">Unit Cost</th>
                <th style="text-align:right;">COGS Amount</th>
                <th>Date</th>
              </tr></thead>
              <tbody>`;
          data.consumption.forEach(c => {
            consumptionHtml += `<tr>
              <td style="font-weight:600;color:#1a1f3a;">${escapeHtml(c['Reference'] || '-')}</td>
              <td style="text-align:right;">${parseFloat(c['Qty Consumed']).toFixed(2)}</td>
              <td style="text-align:right;">${fmtP(c['Unit Cost'])}</td>
              <td style="text-align:right;font-weight:600;color:#dc2626;">${fmtP(c['COGS Amount'])}</td>
              <td style="font-size:11px;color:#64748b;">${escapeHtml(c['Date'] || '-')}</td>
            </tr>`;
          });
          consumptionHtml += `</tbody></table>
            <div class="drawer-totals">
              <div class="total-box">
                <div class="label">Total Consumed</div>
                <div class="value">${parseFloat(data.totalConsumed).toFixed(2)} units</div>
              </div>
              <div class="total-box">
                <div class="label">Total COGS</div>
                <div class="value">${fmtP(data.totalCOGS)}</div>
              </div>
            </div>`;
        }

        // Determine lot status
        const remQty = parseFloat(lot.remaining_qty) || 0;
        const origQty = parseFloat(lot.original_qty) || 0;
        let statusBadge = '';
        if (remQty <= 0) statusBadge = '<span style="display:inline-block;font-size:10px;font-weight:700;color:#9ca3af;background:#f3f4f6;border:1px solid #e5e7eb;padding:2px 10px;border-radius:4px;">Depleted</span>';
        else if (remQty < origQty) statusBadge = '<span style="display:inline-block;font-size:10px;font-weight:700;color:#d97706;background:#fffbeb;border:1px solid #fde68a;padding:2px 10px;border-radius:4px;">Partial</span>';
        else statusBadge = '<span style="display:inline-block;font-size:10px;font-weight:700;color:#059669;background:#ecfdf5;border:1px solid #a7f3d0;padding:2px 10px;border-radius:4px;">Full</span>';

        drawer.innerHTML = `
          <div class="fifo-drawer-header">
            <h3>Lot Consumption History</h3>
            <p class="subtitle">${escapeHtml(lot.item_name || '')} — ${escapeHtml(lot.receive_reference || '')} ${statusBadge}</p>
            <button class="fifo-drawer-close" onclick="closeFifoDrawer()">&times;</button>
          </div>
          <div class="fifo-drawer-body">
            <div class="fifo-drawer-lot-info">
              <div class="info-card">
                <div class="label">Receive Date</div>
                <div class="value">${escapeHtml(lot.receive_date || '-')}</div>
              </div>
              <div class="info-card">
                <div class="label">Unit Cost</div>
                <div class="value">${fmtP(lot.unit_cost)}</div>
              </div>
              <div class="info-card">
                <div class="label">Original Qty</div>
                <div class="value">${parseFloat(lot.original_qty).toFixed(2)}</div>
              </div>
              <div class="info-card">
                <div class="label">Remaining Qty</div>
                <div class="value">${parseFloat(lot.remaining_qty).toFixed(2)}</div>
              </div>
              <div class="info-card">
                <div class="label">Current Lot Value</div>
                <div class="value" style="color:#059669;">${fmtP(lot.lot_value)}</div>
              </div>
              <div class="info-card">
                <div class="label">Consumption Rate</div>
                <div class="value">${origQty > 0 ? ((1 - remQty/origQty) * 100).toFixed(1) + '%' : '0%'}</div>
              </div>
            </div>
            <div class="fifo-drawer-section-title">Transaction History</div>
            ${consumptionHtml}
          </div>`;

      } catch (err) {
        drawer.innerHTML = `
          <div class="fifo-drawer-header">
            <h3>Lot Consumption History</h3>
            <p class="subtitle">Error loading data</p>
            <button class="fifo-drawer-close" onclick="closeFifoDrawer()">&times;</button>
          </div>
          <div class="fifo-drawer-body">
            <div class="no-consumption">
              <p style="color:#dc2626;font-weight:600;">Error: ${escapeHtml(err.message)}</p>
            </div>
          </div>`;
      }
    }

    function closeFifoDrawer() {
      const overlay = document.getElementById('fifoDrawerOverlay');
      const drawer = document.getElementById('fifoDrawer');
      if (overlay) overlay.classList.remove('open');
      if (drawer) drawer.classList.remove('open');
    }
  </script>
    <script src="/js/sticky-headers.js"></script>
</body>

</html>
